<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الأجور والتقييم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F3ECD8; --paper2:#EAE1C3; --paper-deep:#E7DCB8;
    --ink:#22303F; --ink-soft:#5B6774; --ink-faint:#8C97A3;
    --brass:#9C7318; --brass-light:#C9A227; --brass-pale:#EFE1B0;
    --burgundy:#7A2E2E; --burgundy-light:#9C4444;
    --forest:#3C6E47; --forest-light:#5C9269;
    --line:#CDBE93; --white:#FFFDF6;
    --r-sm:6px; --r-md:10px; --r-lg:16px;
    --shadow-sm:0 1px 3px rgba(34,48,63,.10);
    --shadow-md:0 4px 16px rgba(34,48,63,.13), 0 1px 3px rgba(34,48,63,.07);
    --shadow-lg:0 14px 34px rgba(34,48,63,.18), 0 3px 10px rgba(34,48,63,.09);
    --shadow-gold:0 0 0 3px rgba(156,115,24,.16);
    --shadow:var(--shadow-md);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; font-family:'Cairo',sans-serif; color:var(--ink);
    background:var(--paper);
    background-image:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 37px, var(--line) 37px, var(--line) 38px),
      radial-gradient(circle at 15% 8%, rgba(156,115,24,.05), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(122,46,46,.04), transparent 45%);
    min-height:100vh; direction:rtl;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--brass-light); color:var(--white); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--paper2); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; border:2px solid var(--paper2); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--brass); }
  :focus-visible{ outline:2.5px solid var(--brass); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }
  h1,h2,h3,.serif{ font-family:'Markazi Text',serif; }
  #app{ max-width:1040px; margin:0 auto; padding:18px 16px 60px; animation:fadeUp .5s var(--ease); }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .topbar{ display:flex; align-items:center; justify-content:center; gap:10px; padding:9px 12px;
    background:linear-gradient(180deg, #29394B, var(--ink)); color:var(--white); position:sticky; top:0; z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.18); backdrop-filter:blur(6px); }
  .topbar img{ height:28px; width:auto; background:#fff; border-radius:6px; padding:2px; box-shadow:var(--shadow-sm); }
  .topbar span{ font-family:'Markazi Text'; font-weight:700; font-size:17px; letter-spacing:.3px; }
  .brandbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; margin-bottom:18px;
    background:linear-gradient(135deg, #24333F, #1B2733); color:var(--white); border-radius:var(--r-lg);
    box-shadow:var(--shadow-lg); flex-wrap:wrap; gap:10px; border:1px solid rgba(201,162,39,.25);
    animation:fadeUp .45s var(--ease); }
  .brandbar h1{ margin:0; font-size:27px; font-weight:700; letter-spacing:.2px; }
  .brandbar .sub{ font-size:13px; color:#B9C6D2; margin-top:2px; }
  .brandbar .who{ font-size:14px; }
  .brandbar .who b{ color:var(--brass-light); }
  .tab-bar{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:0; border-bottom:2px solid var(--line);
    overflow-x:auto; scrollbar-width:none; }
  .tab-bar::-webkit-scrollbar{ display:none; }
  .tab{ font-family:'Cairo'; font-weight:600; font-size:14px; padding:10px 18px; cursor:pointer; border:none;
    background:transparent; color:var(--ink-soft); border-radius:var(--r-sm) var(--r-sm) 0 0;
    border-bottom:3px solid transparent; transition:background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
    white-space:nowrap; position:relative; top:2px; }
  .tab:hover{ background:var(--paper2); color:var(--ink); }
  .tab.active{ background:var(--white); color:var(--ink); border-bottom:3px solid var(--brass);
    box-shadow:0 -2px 8px rgba(34,48,63,.06); font-weight:700; }
  .tab-bar + .card, .tab-bar ~ *{ }
  .card{ background:var(--white); border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow-md); margin-bottom:16px;
    position:relative; border-top:3px solid var(--brass-light); animation:fadeUp .35s var(--ease);
    transition:box-shadow .2s var(--ease); }
  .card h2{ margin:0 0 14px; font-size:22px; display:flex; align-items:center; gap:8px; }
  .card h3{ margin:0 0 10px; font-size:19px; color:var(--ink-soft); }
  .muted{ color:var(--ink-soft); font-size:13.5px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:150px; }
  label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;
    letter-spacing:.1px; }
  input, select{ width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--r-sm); font-family:'Cairo';
    font-size:14.5px; background:#FFFDF9; color:var(--ink); margin-bottom:12px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease); box-shadow:inset 0 1px 2px rgba(34,48,63,.04); }
  input::placeholder{ color:var(--ink-faint); }
  input:hover, select:hover{ border-color:var(--brass-light); }
  input:focus, select:focus{ outline:none; border-color:var(--brass); box-shadow:var(--shadow-gold); }
  select{ appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%239C7318' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:left 12px center; padding-left:34px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 22px; border-radius:var(--r-sm);
    border:none; font-family:'Cairo'; font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s var(--ease), box-shadow .12s var(--ease), background .15s var(--ease), opacity .12s var(--ease); }
  .btn:hover{ transform:translateY(-1.5px); box-shadow:var(--shadow-sm); }
  .btn:active{ transform:translateY(0); box-shadow:none; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:#33465C; }
  .btn-brass{ background:linear-gradient(135deg, var(--brass-light), var(--brass)); color:var(--white); }
  .btn-brass:hover{ background:linear-gradient(135deg, #D6AE33, var(--brass-light)); }
  .btn-outline{ background:transparent; border:1.5px solid var(--ink-soft); color:var(--ink-soft); }
  .btn-outline:hover{ background:var(--paper2); border-color:var(--ink); color:var(--ink); }
  .btn-danger{ background:transparent; color:var(--burgundy); border:1.5px solid var(--burgundy); padding:6px 12px; font-size:13px;}
  .btn-danger:hover{ background:#F6E9E9; border-color:var(--burgundy-light); }
  .btn-sm{ padding:6px 14px; font-size:13px; }
  table.ledger{ display:block; max-width:100%; overflow-x:auto; width:100%; border-collapse:collapse; font-size:13.5px; }
  table.ledger th{ text-align:right; padding:9px 8px; border-bottom:2px solid var(--ink); color:var(--ink-soft);
    font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
  table.ledger td{ padding:10px 8px; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
  table.ledger tbody tr{ transition:background .12s var(--ease); }
  table.ledger tbody tr:hover{ background:var(--paper2); }
  table.ledger tr:last-child td{ border-bottom:none; }
  table.ledger tr.total-row td{ border-top:2px solid var(--ink); font-weight:800; padding-top:13px; background:transparent; }
  .amt{ font-weight:700; color:var(--forest); }
  .neg{ color:var(--burgundy); font-weight:700; }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 12px 4px 10px; border-radius:20px; font-size:12px;
    font-weight:700; white-space:nowrap; }
  .badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .badge-present{ background:#E1EEE3; color:var(--forest); }
  .badge-absent{ background:#F3E1E1; color:var(--burgundy); }
  .badge-open{ background:#FCF0D6; color:var(--brass); }
  .stamp{ position:absolute; top:16px; left:16px; width:92px; height:92px; border-radius:50%;
    border:3px double var(--burgundy); color:var(--burgundy); display:flex; align-items:center; justify-content:center;
    text-align:center; transform:rotate(-14deg); font-family:'Markazi Text',serif; font-weight:700; font-size:16px;
    opacity:.85; line-height:1.15; pointer-events:none;
    background:radial-gradient(circle, rgba(122,46,46,.06), transparent 70%);
    box-shadow:inset 0 0 0 5px rgba(122,46,46,.06); mix-blend-mode:multiply; }
  .login-wrap{ max-width:460px; margin:60px auto 0; display:flex; flex-direction:column; gap:0;
    animation:fadeUp .45s var(--ease); }
  .role-tabs{ display:flex; gap:8px; margin-bottom:18px; background:var(--paper2); padding:5px; border-radius:var(--r-md); }
  .role-tabs .tab{ flex:1; text-align:center; border-radius:var(--r-sm); border-bottom:none; top:0; }
  .role-tabs .tab.active{ background:var(--white); box-shadow:var(--shadow-sm); }
  .worker-checkin-box{ text-align:center; padding:34px 10px; }
  .clock{ font-family:'Markazi Text'; font-size:56px; font-weight:700; color:var(--ink); margin:8px 0 2px;
    letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .list-item{ display:flex; align-items:center; justify-content:space-between; padding:11px 8px;
    border-bottom:1px dashed var(--line); gap:10px; flex-wrap:wrap; border-radius:var(--r-sm);
    transition:background .12s var(--ease); }
  .list-item:hover{ background:var(--paper2); }
  .list-item:last-child{ border-bottom:none; }
  .pin-tag{ font-family:'Markazi Text'; font-weight:700; letter-spacing:2px; color:var(--brass);
    background:var(--brass-pale); padding:2px 10px; border-radius:6px; }
  .empty{ text-align:center; padding:34px 10px; color:var(--ink-soft); animation:fadeIn .3s var(--ease); }
  .rubric{ background:var(--paper2); border-radius:var(--r-md); padding:13px 15px; font-size:13px; color:var(--ink-soft);
    margin-bottom:12px; border-inline-start:3px solid var(--brass-light); }
  .rubric b{ color:var(--ink); }
  .rubric ul{ margin:6px 0 0; padding-inline-start:18px; }
  details.rubric-box summary{ cursor:pointer; font-weight:700; color:var(--brass); font-size:13.5px; margin-bottom:8px;
    list-style:none; }
  details.rubric-box summary::-webkit-details-marker{ display:none; }
  details.rubric-box summary::before{ content:'▸'; display:inline-block; margin-inline-end:5px; transition:transform .15s var(--ease); }
  details.rubric-box[open] summary::before{ transform:rotate(90deg); }
  @media (max-width:640px){
    #app{ padding:12px 10px 50px; }
    .brandbar{ flex-direction:column; align-items:flex-start; padding:14px 16px; }
    .brandbar .who{ width:100%; justify-content:space-between; }
    .card{ padding:16px; }
    .login-wrap{ margin-top:24px; }
    .clock{ font-size:44px; }
    .tab{ padding:9px 13px; font-size:13px; }
    .stamp{ width:74px; height:74px; font-size:13px; top:10px; left:10px; }
  }
</style>
</head>

function cookieSetRaw(name, value){
  try{
    const d = new Date(); d.setFullYear(d.getFullYear()+10);
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
  }catch(e){}
}
function getDeviceId(){
  const KEY = 'wagesAppDeviceId';
  let id = null;
  try{ id = localStorage.getItem(KEY); }catch(e){}
  if(!id){ id = cookieGetRaw(KEY); }
  if(!id && window.__memDeviceId){ id = window.__memDeviceId; }
  if(!id){ id = 'dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
  // إعادة الكتابة في كل الأماكن الممكنة في كل مرة، حتى لو انمسح من مكان واحد يبقى محفوظاً بمكان آخر
  try{ localStorage.setItem(KEY, id); }catch(e){}
  cookieSetRaw(KEY, id);
  window.__memDeviceId = id;
  return id;
}

/* ------ الموقع الجغرافي (GPS) ------ */
function getGeoLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    const timer = setTimeout(()=>resolve(null), 6000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}); },
      ()=>{ clearTimeout(timer); resolve(null); },
      { enableHighAccuracy:true, timeout:5500, maximumAge:60000 }
    );
  });
}
function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function mapLink(lat,lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }

/* ================= CALCULATIONS ================= */
function presentDaysCount(workerId, month){
  const days = new Set(attendance.filter(a=>a.workerId===workerId && a.date.slice(0,7)===month && a.checkIn).map(a=>a.date));
  return days.size;
}
function getMonthlyRecord(workerId, month){
  return monthly.find(m=>m.workerId===workerId && m.month===month) || { extraDays:0, liveCount:0, overtimeHours:0, salesScore:0, mediaScore:0, transport:0, excusedAbsence:0, note:'' };
}
function toMinutes(t){ if(!t) return null; const p=t.split(':'); return Number(p[0])*60+Number(p[1]); }
function isLateRecord(rec){
  if(!rec.checkIn) return false;
  const shift = rec.shift || computeShift(rec.checkIn);
  const startStr = shift==='صباحي' ? (config.morningShiftStart||'08:00') : (config.shiftSplitTime||'14:30');
  const diff = toMinutes(rec.checkIn) - toMinutes(startStr);
  return diff > (config.lateThresholdMinutes||10);
}
function lateCountForMonth(workerId, month){
  return attendance.filter(a=>a.workerId===workerId && a.date.slice(0,7)===month && isLateRecord(a)).length;
}
function lateWarnings(month, onlyWorkerId){
  const threshold = config.lateCountForAbsence||5;
  let list = onlyWorkerId ? workers.filter(w=>w.id===onlyWorkerId) : workers;
  return list.map(w=>({ w, lc:lateCountForMonth(w.id, month) }))
    .filter(x=> x.lc>0 && (x.lc % threshold === threshold-1 || x.lc % threshold === 0));
}
function lateWarningBanner(month, onlyWorkerId){
  const warns = lateWarnings(month, onlyWorkerId);
  if(!warns.length) return '';
  const threshold = config.lateCountForAbsence||5;
  const rows = warns.map(x=>{
    const aboutToHit = x.lc % threshold === threshold-1;
    const msg = aboutToHit
      ? `عنده ${x.lc} تأخيرات هذا الشهر — تأخير واحد آخر يساوي خصم يوم غياب من الأجرة`
      : `وصل لـ ${x.lc} تأخيرات هذا الشهر — تم خصم ${Math.floor(x.lc/threshold)} يوم غياب من الأجرة بسبب التأخر`;
    return `<div class="list-item"><div><b>${esc(x.w.name)}</b> — ${msg}</div></div>`;
  }).join('');
  return `<div class="card" style="border-top-color:var(--burgundy);">
    <h3>⚠️ تنبيه التأخر</h3>${rows}
  </div>`;
}
function calcWage(workerId, month){
  const w = workers.find(x=>x.id===workerId);
  if(!w) return null;
  const present = presentDaysCount(workerId, month);
  const N = config.expectedMonthDays || 30;
  const baseSalary = w.baseSalary!=null ? w.baseSalary : config.baseSalary;
  const evalBonusPool = w.evalBonusPool!=null ? w.evalBonusPool : config.evalBonusPool;
  const liveRate = w.liveRate!=null ? w.liveRate : config.liveRate;
  const rec = getMonthlyRecord(workerId, month);
  const autoAbsence = Math.max(N - present, 0);
  const excusedAbsence = Math.min(Number(rec.excusedAbsence||0), autoAbsence);
  const lateCount = lateCountForMonth(workerId, month);
  const lateAbsenceDays = Math.floor(lateCount / (config.lateCountForAbsence||5));
  const absence = Math.max(autoAbsence - excusedAbsence + lateAbsenceDays, 0);
  const dayRate = baseSalary / N;
  const grossSalary = baseSalary + (Number(rec.extraDays||0) - absence) * dayRate;
  const evalPoolWorked = (evalBonusPool / N) * (N - absence);
  const evalTotal = Number(rec.salesScore||0) + Number(rec.mediaScore||0);
  const bonus = evalPoolWorked * (evalTotal/100);
  const livePay = Number(rec.liveCount||0) * liveRate;
  const overtimePay = (dayRate / (config.workdayHours||6.5)) * Number(rec.overtimeHours||0);
  const transport = Number(rec.transport||0);
  const total = grossSalary + bonus + livePay + overtimePay + transport;
  const rounded = Math.round(total/100)*100;
  return { w, present, expected:N, autoAbsence, excusedAbsence, lateCount, lateAbsenceDays, absence, rec, baseSalary, evalBonusPool, liveRate, dayRate, grossSalary, evalPoolWorked, evalTotal, bonus, livePay, overtimePay, transport, total, rounded };
}
function isPaid(workerId, month){ return !!payments.find(p=>p.workerId===workerId && p.month===month && p.paid); }

/* ------ طلبات المتعاونين (أيام إضافية / لايف / ساعات إضافية) ------ */
const REQ_TYPES = { extraDays:'يوم عمل إضافي', live:'جلسة لايف', overtime:'ساعات إضافية', excusedAbsence:'غياب مبرر (لا يُخصم)' };
const REQ_FIELD = { extraDays:'extraDays', live:'liveCount', overtime:'overtimeHours', excusedAbsence:'excusedAbsence' };
function addRequest(workerId, type, amount, note, month){
  if(!amount || amount<=0){ alert('أدخل قيمة صحيحة'); return; }
  requests.push({ id:uid(), workerId, type, amount:Number(amount), note:note||'', month, status:'pending', createdAt:todayStr() });
  saveRequests();
  const w = workers.find(x=>x.id===workerId);
  logActivity(`${w?w.name:'؟'} قدّم طلب ${REQ_TYPES[type]}: ${amount} (${month})`);
  render();
}
function decideRequest(id, approve){
  const req = requests.find(r=>r.id===id);
  if(!req || req.status!=='pending') return;
  req.status = approve? 'approved':'rejected';
  req.decidedBy = state.session.name; req.decidedAt = todayStr();
  if(approve){
    const field = REQ_FIELD[req.type];
    let rec = monthly.find(m=>m.workerId===req.workerId && m.month===req.month);
    if(!rec){ rec = { id:uid(), workerId:req.workerId, month:req.month, extraDays:0, liveCount:0, overtimeHours:0, salesScore:0, mediaScore:0, transport:0, excusedAbsence:0, note:'' }; monthly.push(rec); }
    rec[field] = Number(rec[field]||0) + req.amount;
    saveMonthly();
  }
  saveRequests();
  const w = workers.find(x=>x.id===req.workerId);
  logActivity(`${state.session.name} ${approve?'وافق على':'رفض'} طلب ${REQ_TYPES[req.type]} للمتعاون ${w?w.name:'؟'} (${req.month})`);
  render();
}
function pendingRequestsCount(){ return requests.filter(r=>r.status==='pending').length; }
function togglePaid(workerId, month){
  let rec = payments.find(p=>p.workerId===workerId && p.month===month);
  if(!rec){ rec={workerId, month, paid:false}; payments.push(rec); }
  rec.paid = !rec.paid; rec.paidDate = rec.paid? todayStr(): null;
  savePayments();
  const w = workers.find(x=>x.id===workerId);
  logActivity(`${state.session.name} علّم أجرة ${w?w.name:'؟'} لشهر ${month} كـ ${rec.paid?'مصروف':'غير مصروف'}`);
  render();
}
function daysUntilPayday(){
  const now=new Date(); const day=config.paydayDay||6;
  let target=new Date(now.getFullYear(), now.getMonth(), day);
  if(target<now) target=new Date(now.getFullYear(), now.getMonth()+1, day);
  return Math.ceil((target-now)/(1000*60*60*24));
}
function paydayBanner(){
  const d=daysUntilPayday();
  const label = d===0? 'اليوم هو يوم صرف الأجور 💰' : `باقي ${d} ${d===1?'يوم':'أيام'} على موعد صرف الأجور (يوم ${config.paydayDay} من كل شهر)`;
  return `<div class="card" style="border-top-color:var(--forest); text-align:center; padding:12px;"><b>${label}</b></div>`;
}

async function checkShopNetwork(){
  if(!config.shopPublicIP){ return true; } // لم يُضبط بعد، لا قيود
  try{
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip === config.shopPublicIP;
  }catch(e){
    alert('تعذر التحقق من الشبكة (تأكد من الاتصال بالإنترنت). لن يتم تسجيل الحضور.');
    return false;
  }
}

/* ------ تصدير إلى Google Sheet (اتجاه واحد) ------ */
async function exportToSheet(month){
  if(!config.sheetsWebhookUrl){ alert('أدخل رابط Google Apps Script أولاً من الإعدادات'); return; }
  const rows = workers.map(w=>{
    const c = calcWage(w.id, month);
    return { month, workerName:c.w.name, present:c.present, expected:c.expected, absence:c.absence,
      extraDays:c.rec.extraDays||0, salesScore:c.rec.salesScore||0, mediaScore:c.rec.mediaScore||0, evalTotal:c.evalTotal,
      bonus:Math.round(c.bonus), livePay:Math.round(c.livePay), overtimePay:Math.round(c.overtimePay), transport:c.transport,
      grossSalary:Math.round(c.grossSalary), total:c.rounded, paid: isPaid(w.id, month) };
  });
  try{
    await fetch(config.sheetsWebhookUrl, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ type:'wages', shopName:config.shopName, month, rows })
    });
    alert('تم إرسال بيانات الشهر إلى Google Sheet. تحقق من الشيت للتأكد.');
  }catch(e){
    alert('حدث خطأ أثناء الإرسال، تحقق من الرابط والاتصال بالإنترنت.');
  }
}
async function exportActivityToSheet(month){

  const rows = activityLog.filter(a=> a.at.slice(0,7)===month).sort((a,b)=> a.at.localeCompare(b.at)).map(a=>{
    const d = new Date(a.at);
    return { date:d.toISOString().slice(0,10), time:d.toTimeString().slice(0,5), actor:a.actor, action:a.action };
  });
  try{
    await fetch(config.sheetsWebhookUrl, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ type:'activity', shopName:config.shopName, month, rows })
    });
    alert('تم إرسال السجل العام إلى Google Sheet. تحقق من الشيت للتأكد.');
  }catch(e){
    alert('حدث خطأ أثناء الإرسال، تحقق من الرابط والاتصال بالإنترنت.');

function exportActivityCSV(month){
  const rows = activityLog.filter(a=> a.at.slice(0,7)===month).sort((a,b)=> a.at.localeCompare(b.at));
  let csv = '\uFEFF' + 'التاريخ,الوقت,الفاعل,الحدث\n';
  rows.forEach(a=>{
    const d = new Date(a.at);
    const dateStr = d.toISOString().slice(0,10);
    const timeStr = d.toTimeString().slice(0,5);
    const clean = s => `"${(s||'').toString().replace(/"/g,'""')}"`;
    csv += `${dateStr},${timeStr},${clean(a.actor)},${clean(a.action)}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `السجل_العام_${month}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ------ نظرة عامة على كل المحلات ------ */
async function loadAllShopsOverview(month){
  const savedConfig=config, savedWorkers=workers, savedAttendance=attendance, savedMonthly=monthly, savedPayments=payments, savedShopId=state.shopId;
  const results = [];
  for(const s of shopsRegistry.shops){
    state.shopId = s.id;
    try{
      const cfg = await fbGet(KEYS.config);
      if(!cfg){ results.push({ id:s.id, name:s.name, notSetup:true }); continue; }
      config = cfg;
      workers = (await fbGet(KEYS.workers)) || [];
      attendance = (await fbGet(KEYS.attendance)) || [];
      monthly = (await fbGet(KEYS.monthly)) || [];
      payments = (await fbGet(KEYS.payments)) || [];
      let totalWage=0, totalLate=0;
      workers.forEach(w=>{
        const c = calcWage(w.id, month);
        totalWage += c.rounded; totalLate += c.lateCount;
      });
      const N = config.expectedMonthDays||30;
      const latePct = workers.length? Math.round((totalLate/(workers.length*N))*1000)/10 : 0;
      results.push({ id:s.id, name:config.shopName||s.name, notSetup:false, workerCount:workers.length, totalWage, totalLate, latePct });
    }catch(e){
      results.push({ id:s.id, name:s.name, error:true });
    }
  }
  config=savedConfig; workers=savedWorkers; attendance=savedAttendance; monthly=savedMonthly; payments=savedPayments; state.shopId=savedShopId;
  return results;
}

async function doLoginWorker(){
  const id=document.getElementById('lg-w').value, pin=document.getElementById('lg-pin').value.trim();
  const w=workers.find(x=>x.id===id);
  if(!(w&&pin===w.pin)){ alert('رمز خاطئ'); return; }

  let freshWorkers;
  try{ freshWorkers = (await fbGet(KEYS.workers)) || workers; }catch(e){ freshWorkers = workers; }
  const idx = freshWorkers.findIndex(x=>x.id===id);
  const fw = freshWorkers[idx];
  const deviceId = getDeviceId();
  if(fw && fw.lockedDeviceId && fw.lockedDeviceId !== deviceId && !fw.deviceLockDisabled){
    alert('هذا الرمز مرتبط بجهاز آخر.\n\nإذا بدّلت هاتفك فعلاً: اطلب من صاحب المحل أو المسؤول يفك ربط جهازك من تبويب "المتعاونين".\n\nإذا كان نفس هاتفك دائماً وتظهر لك هذه الرسالة بشكل متكرر: افتح الرابط من متصفح عادي (Chrome أو Safari) وليس من داخل واتساب أو انستغرام أو ماسنجر، ولا تستخدم وضع التصفح الخفي، ثم احفظ الصفحة على الشاشة الرئيسية وافتحها دائماً من هناك.');
    return;
  }
  if(fw && !fw.lockedDeviceId && !fw.deviceLockDisabled){
    fw.lockedDeviceId = deviceId;
    let ok2=false;
    try{ await fbSetPath(`${KEYS.workers}/${idx}/lockedDeviceId`, deviceId); ok2=true; }catch(e){ console.error('scoped lock write failed', e); }
    if(!ok2){ try{ await fbSet(KEYS.workers, freshWorkers); }catch(e2){ console.error('fallback full write failed too', e2); } }
  }
  workers = freshWorkers;
  state.session={role:'worker', id:w.id, name:w.name}; state.screen='worker'; state.tab='checkin'; render();
}

async function saveWorkerWage(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const base = Number(document.getElementById(`ww-base-${id}`).value||0);
  const ev = Number(document.getElementById(`ww-eval-${id}`).value||0);
  const live = Number(document.getElementById(`ww-live-${id}`).value||0);
  workers[idx].baseSalary = base; workers[idx].evalBonusPool = ev; workers[idx].liveRate = live;
  try{
    await fbSetPath(`${KEYS.workers}/${idx}/baseSalary`, base);
    await fbSetPath(`${KEYS.workers}/${idx}/evalBonusPool`, ev);
    await fbSetPath(`${KEYS.workers}/${idx}/liveRate`, live);
  }catch(e){
    console.error('scoped wage write failed, falling back', e);
    try{ await fbSet(KEYS.workers, workers); }catch(e2){}
  }
  state.editWorkerWageId=null;
  logActivity(`${state.session.name} عدّل إعدادات أجرة ${workers[idx].name}`);
  render();
}
async function saveWorkerPin(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const pin = document.getElementById(`wp-pin-${id}`).value.trim();
  if(!pin){ alert('أدخل رمزاً صحيحاً'); return; }
  workers[idx].pin = pin;
  try{ await fbSetPath(`${KEYS.workers}/${idx}/pin`, pin); }
  catch(e){ console.error('scoped pin write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  state.editWorkerPinId=null;
  logActivity(`${state.session.name} غيّر رمز دخول ${workers[idx].name}`);
  render();
}
async function resetDeviceLock(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  workers[idx].lockedDeviceId=null;
  try{ await fbSetPath(`${KEYS.workers}/${idx}/lockedDeviceId`, null); }
  catch(e){ console.error('scoped unlock write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  logActivity(`${state.session.name} أعاد ربط جهاز ${workers[idx].name}`);
  render();
}
async function toggleDeviceLockRequirement(id){
  if(state.session.role!=='owner') return;
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const next = !workers[idx].deviceLockDisabled;
  workers[idx].deviceLockDisabled = next;
  if(next){ workers[idx].lockedDeviceId = null; } // إلغاء أي ربط سابق عند التحويل لوضع "بدون ربط"
  try{ await fbSetPath(`${KEYS.workers}/${idx}`, workers[idx]); }
  catch(e){ console.error('scoped device-lock toggle write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  logActivity(`${state.session.name} ${next?'عطّل':'فعّل'} ربط الجهاز لـ${workers[idx].name}`);
  render();
}
function addWorker(){
  const name=document.getElementById('w-name').value.trim(), pin=document.getElementById('w-pin').value.trim();
  if(!name||!pin){ alert('أدخل الاسم ورمز الدخول'); return; }
  const elBase=document.getElementById('w-base'), elEval=document.getElementById('w-eval'), elLive=document.getElementById('w-live');
  const elPhone=document.getElementById('w-phone');
  const baseSalary = Number((elBase?elBase.value:'')||config.baseSalary);
  const evalBonusPool = Number((elEval?elEval.value:'')||config.evalBonusPool);
  const liveRate = Number((elLive?elLive.value:'')||config.liveRate);
  const phone = (elPhone?elPhone.value:'').trim();
  workers.push({ id:uid(), name, pin, baseSalary, evalBonusPool, liveRate, phone }); saveWorkers();
  logActivity(`${state.session.name} أضاف متعاون جديد: ${name}`);
  render();
}
function waNumber(phone){
  let d = (phone||'').replace(/[^\d]/g,'');
  if(!d) return null;
  if(d.startsWith('00')) d = d.slice(2);
  else if(d.startsWith('0')) d = '213'+d.slice(1); // رقم جزائري محلي (05/06/07...) → صيغة دولية
  return d;
}
function waLink(phone, text){
  const n = waNumber(phone);
  if(!n) return null;
  return `https://wa.me/${n}?text=${encodeURIComponent(text)}`;
}
async function saveWorkerPhone(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const val = document.getElementById(`w-phone-${id}`).value.trim();
  workers[idx].phone = val;
  try{ await fbSetPath(`${KEYS.workers}/${idx}/phone`, val); }
  catch(e){ console.error('scoped phone write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  logActivity(`${state.session.name} عدّل رقم هاتف ${workers[idx].name}`);
  state.editWorkerPhoneId=null;

}
function deleteWorker(id){
  const w = workers.find(x=>x.id===id);
  workers = workers.filter(w=>w.id!==id); state.confirmDeleteId=null; saveWorkers();
  logActivity(`${state.session.name} حذف متعاون: ${w?w.name:'؟'}`);
  render();
}

function monthsAgoStr(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return d.toISOString().slice(0,7); }
async function archiveOldData(){
  const keepMonths = Number(document.getElementById('archive-keep-months').value||6);
  const cutoff = monthsAgoStr(keepMonths);
  const isOldDate = d => d && d.slice(0,7) < cutoff;
  const isOldMonth = m => m && m < cutoff;

  const oldAttendance = attendance.filter(a=>isOldDate(a.date));
  const newAttendance = attendance.filter(a=>!isOldDate(a.date));
  const oldActivity = activityLog.filter(a=>isOldDate(a.at));
  const newActivity = activityLog.filter(a=>!isOldDate(a.at));
  const oldDuty = dutyLog.filter(d=>isOldDate(d.date));
  const newDuty = dutyLog.filter(d=>!isOldDate(d.date));
  const oldRequests = requests.filter(r=>isOldMonth(r.month));
  const newRequests = requests.filter(r=>!isOldMonth(r.month));
  const oldMonthly = monthly.filter(m=>isOldMonth(m.month));
  const newMonthly = monthly.filter(m=>!isOldMonth(m.month));
  const oldPayments = payments.filter(p=>isOldMonth(p.month));
  const newPayments = payments.filter(p=>!isOldMonth(p.month));
  const oldSupAtt = supervisorAttendance.filter(a=>isOldDate(a.date));
  const newSupAtt = supervisorAttendance.filter(a=>!isOldDate(a.date));

  const totalOld = oldAttendance.length+oldActivity.length+oldDuty.length+oldRequests.length+oldMonthly.length+oldPayments.length+oldSupAtt.length;
  if(totalOld===0){ alert('لا يوجد بيانات أقدم من ' + cutoff + ' للأرشفة.'); return; }

  const archive = { archivedAt:new Date().toISOString(), cutoff, shopName:config.shopName,
    attendance:oldAttendance, activityLog:oldActivity, dutyLog:oldDuty, requests:oldRequests, monthly:oldMonthly, payments:oldPayments, supervisorAttendance:oldSupAtt };
  const blob = new Blob([JSON.stringify(archive, null, 2)], {type:'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Archive_${(config.shopName||'shop').replace(/[^\p{L}\p{N}]+/gu,'_')}_قبل_${cutoff}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  attendance = newAttendance; activityLog = newActivity; dutyLog = newDuty; requests = newRequests;
  monthly = newMonthly; payments = newPayments; supervisorAttendance = newSupAtt;
  try{
    await Promise.all([
      fbSet(KEYS.attendance, attendance), fbSet(KEYS.activity, activityLog), fbSet(KEYS.duty, dutyLog),
      fbSet(KEYS.requests, requests), fbSet(KEYS.monthly, monthly), fbSet(KEYS.payments, payments),
      fbSet(KEYS.supAttendance, supervisorAttendance)
    ]);
    alert(`تم أرشفة ${totalOld} سجل (قبل ${cutoff}) وتحميلها في ملف، وتنظيفها من البرنامج النشط.`);
  }catch(e){
    alert('تم تحميل الأرشيف، لكن حدث خطأ أثناء الحذف من القاعدة. حاول مجدداً أو تحقق من الاتصال.');
  }
  render();
}

  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ alert('الملف غير صالح'); return; }
  if(!data.config || !data.workers){ alert('الملف لا يحتوي على بيانات صحيحة'); return; }
  try{
    config = data.config; workers = data.workers||[]; attendance = data.attendance||[]; monthly = data.monthly||[];
    payments = data.payments||[]; requests = data.requests||[]; activityLog = data.activityLog||[]; dutyLog = data.dutyLog||[];
    supervisorAttendance = data.supervisorAttendance||[];
    await Promise.all([
      fbSet(KEYS.config, config), fbSet(KEYS.workers, workers), fbSet(KEYS.attendance, attendance),
      fbSet(KEYS.monthly, monthly), fbSet(KEYS.payments, payments), fbSet(KEYS.requests, requests),
      fbSet(KEYS.activity, activityLog), fbSet(KEYS.duty, dutyLog), fbSet(KEYS.supAttendance, supervisorAttendance)
    ]);

  }catch(e){
    alert('حدث خطأ أثناء الاستعادة، تحقق من الاتصال بالإنترنت وحاول مجدداً.');
  }
}

function supTab(t){ state.tab=t; state.detailWorkerId=null; state.editAttendanceId=null; state.confirmDeleteId=null; render(); }
function workerOptions(selected){ return workers.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.name)}</option>`).join(''); }

function supAttendance(){
  const today=todayStr();
  const todays=attendance.filter(a=>a.date===today);
  const rows = workers.map(w=>{
    const shiftTags = ['صباحي','مسائي'].map(shift=>{
      const rec = todays.find(a=>a.workerId===w.id && a.shift===shift);
      const status = !rec? `<span class="badge badge-absent">${shift}: لم يحضر</span>`
        : !rec.checkOut? `<span class="badge badge-open">${shift}: حاضر منذ ${rec.checkIn}</span>`
        : `<span class="badge badge-present">${shift}: ${rec.checkIn} - ${rec.checkOut}</span>`;
      const inputId = `mk-time-${w.id}-${shift}`;
      const btns = `${!rec?`
          <input type="time" id="${inputId}" value="${nowTime()}" style="width:auto; display:inline-block; margin:0 4px;">
          <button class="btn btn-brass btn-sm" onclick="markIn('${w.id}','${shift}', document.getElementById('${inputId}').value)">حضور ${shift}</button>`:''}
        ${rec && !rec.checkOut?`
          <input type="time" id="${inputId}" value="${nowTime()}" style="width:auto; display:inline-block; margin:0 4px;">
          <button class="btn btn-outline btn-sm" onclick="markOut('${w.id}','${shift}', document.getElementById('${inputId}').value)">انصراف ${shift}</button>`:''}`;
      return `<div style="margin-bottom:6px;">${status} ${btns}</div>`;
    }).join('');
    return `<div class="list-item">
      <div><b>${esc(w.name)}</b></div>
      <div>${shiftTags}</div></div>`;
  }).join('');
  return `<div class="card"><h2>حضور اليوم — ${today}</h2>
    <p class="muted">الوقت معبّأ تلقائياً بالوقت الحالي، وتقدر تبدله يدوياً قبل الضغط (مفيد لو سجّلت متأخر عن وقت حضور المتعاون الفعلي).</p>
    ${rows||'<p class="empty">لا يوجد متعاونين بعد</p>'}</div>`;
}
function markIn(workerId, shift, time){
  if(attendance.find(a=>a.workerId===workerId && a.date===todayStr() && a.shift===shift)) return;
  attendance.push({id:uid(), workerId, date:todayStr(), shift, checkIn:time||nowTime(), checkOut:null}); saveAttendance();
  const w = workers.find(x=>x.id===workerId);
  logActivity(`${state.session.name} سجّل حضور ${w?w.name:'؟'} (فوج ${shift}) الساعة ${time||nowTime()}`);
  render();
}
function markOut(workerId, shift, time){
  const rec=attendance.find(a=>a.workerId===workerId && a.date===todayStr() && a.shift===shift && !a.checkOut);
  if(rec){
    rec.checkOut=time||nowTime(); saveAttendance();
    const w = workers.find(x=>x.id===workerId);
    logActivity(`${state.session.name} سجّل انصراف ${w?w.name:'؟'} (فوج ${shift}) الساعة ${time||nowTime()}`);
    render();
  }
}

function supSelfCheckin(){
  const todays = supervisorAttendance.filter(a=>a.supervisorId===state.session.id && a.date===todayStr());
  const netNote = config.shopPublicIP ? `<p class="muted" style="margin-top:8px;">التسجيل يعمل فقط عند الاتصال بشبكة واي فاي المحل</p>` : '';
  const shiftBlocks = ['صباحي','مسائي'].map(shift=>{
    const rec = todays.find(a=>a.shift===shift);
    let action;
    if(!rec) action = `<button class="btn btn-brass" onclick="supSelfIn('${shift}')">تسجيل حضور الفوج ${shift}</button>${netNote}`;
    else if(!rec.checkOut) action = `<div class="muted">حضرت الساعة ${rec.checkIn}</div><button class="btn btn-outline" style="margin-top:8px;" onclick="supSelfOut('${shift}')">تسجيل انصراف الفوج ${shift}</button>${netNote}`;
    else action = `<div class="muted">✓ تم: حضور ${rec.checkIn} — انصراف ${rec.checkOut}</div>`;
    return `<div class="card"><h3>الفوج ${shift}</h3>${action}</div>`;
  }).join('');
  return `<div class="card worker-checkin-box"><div class="muted">${todayStr()}</div><div class="clock">${nowTime()}</div></div>${shiftBlocks}`;
}
let supCheckinBusy = false;
async function supSelfIn(shift){
  if(supCheckinBusy) return;
  supCheckinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الحضور'); return; }
    let fresh;
    try{ fresh = (await fbGet(KEYS.supAttendance)) || supervisorAttendance; }catch(e){ fresh = supervisorAttendance; }
    supervisorAttendance = fresh;
    if(supervisorAttendance.find(a=>a.supervisorId===state.session.id && a.date===todayStr() && a.shift===shift)){ render(); return; }
    const geo = await getGeoLocation();
    supervisorAttendance.push({ id:uid(), supervisorId:state.session.id, date:todayStr(), shift, checkIn:nowTime(), checkOut:null,
      lat: geo?geo.lat:null, lng: geo?geo.lng:null });
    saveSupervisorAttendance();
    logActivity(`${state.session.name} (مشرف) سجّل حضوره بنفسه (فوج ${shift})`);
    render();
  } finally { supCheckinBusy = false; }
}
async function supSelfOut(shift){
  if(supCheckinBusy) return;
  supCheckinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الانصراف'); return; }
    const rec = supervisorAttendance.find(a=>a.supervisorId===state.session.id && a.date===todayStr() && a.shift===shift && !a.checkOut);
    if(!rec) return;
    const geo = await getGeoLocation();

function ddmmyyyy(d){ const p=d.split('-'); return `${p[2]}-${p[1]}-${p[0]}`; }
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function lastDayOfMonth(monthStr){ const [y,m]=monthStr.split('-').map(Number); return new Date(y, m, 0).toISOString().slice(0,10); }
function reportRange(){
  const r = state.report;
  if(r.type==='daily') return [r.date, r.date];
  if(r.type==='weekly') return [addDays(r.date, -6), r.date];
  if(r.type==='monthly') return [state.month+'-01', lastDayOfMonth(state.month)];
  if(r.type==='worker') return [r.from, r.to];
  return [r.from, r.to]; // range
}
function reportRows(){
  const [from, to] = reportRange();
  const workerId = (state.report.type==='worker') ? state.report.workerId : null;
  const wname = id => { const w=workers.find(x=>x.id===id); return w?w.name:'؟'; };
  let rows = attendance.filter(a=> a.date>=from && a.date<=to && (!workerId || a.workerId===workerId));
  rows.sort((a,b)=> a.date.localeCompare(b.date) || wname(a.workerId).localeCompare(wname(b.workerId)));
  return rows.map(r=>({
    date:r.date, worker:wname(r.workerId), checkIn:r.checkIn||'', checkOut:r.checkOut||'',
    tasks:(r.tasks||'').split('\n').filter(l=>l.trim()).join('، '),
    taskCount: r.tasks? r.tasks.split('\n').filter(l=>l.trim()).length : 0,
    notes:r.notes||'', late: isLateRecord(r)?'نعم':'لا'
  }));
}
function reportWorkerRequestRows(){
  if(state.report.type!=='worker' || !state.report.workerId) return [];
  const [from, to] = reportRange();
  return requests.filter(rq=> rq.workerId===state.report.workerId && rq.month>=from.slice(0,7) && rq.month<=to.slice(0,7))
    .sort((a,b)=> b.createdAt.localeCompare(a.createdAt))
    .map(rq=>({ date:rq.createdAt, type:REQ_TYPES[rq.type], amount:rq.amount, month:rq.month,
      status: rq.status==='pending'?'قيد الانتظار':rq.status==='approved'?'تمت الموافقة':'مرفوض', note:rq.note||'' }));
}
function reportWorkerDutyRows(){
  if(state.report.type!=='worker' || !state.report.workerId) return [];
  const [from, to] = reportRange();
  return dutyLog.filter(d=> d.workerId===state.report.workerId && d.date>=from && d.date<=to)
    .sort((a,b)=> b.date.localeCompare(a.date))
    .map(d=>({ date:d.date, shift:d.shift, responsibilities: dutyRespText(d) || 'لا مسؤوليات محددة' }));
}

/* ================= لوحة اليوم ================= */
function forgottenCheckouts(){
  return attendance.filter(a=> a.date < todayStr() && a.checkIn && !a.checkOut)
    .sort((a,b)=> b.date.localeCompare(a.date));
}
function dutyGaps(){
  const RESP = ['رسائل الصفحة','واتساب','مكالمات'];
  const today = todayStr();
  const gaps = [];
  ['صباحي','مسائي'].forEach(shift=>{
    const hasAttendance = attendance.some(a=>a.date===today && a.shift===shift && a.checkIn);
    if(!hasAttendance) return; // لا داعي للتنبيه إذا ما حدش حضر في هذا الفوج أصلاً
    const dutiesToday = dutyLog.filter(d=>d.date===today && d.shift===shift);
    const covered = new Set();
    dutiesToday.forEach(d=> (d.responsibilities||[]).forEach(r=>covered.add(r)));
    RESP.forEach(r=>{ if(!covered.has(r)) gaps.push({ shift, responsibility:r }); });
  });
  return gaps;
}
function todayDashboard(){
  const today = todayStr();
  const todays = attendance.filter(a=>a.date===today);
  const presentNow = todays.filter(a=>a.checkIn && !a.checkOut);

  const lateToday = todays.filter(a=> a.checkIn && isLateRecord(a));
  const forgotten = forgottenCheckouts();
  const gaps = dutyGaps();
  const pendingReqs = requests.filter(r=>r.status==='pending');
  const wname = id => { const w=workers.find(x=>x.id===id); return w?w.name:'؟'; };

  const lateCard = lateToday.length ? `<div class="card" style="border-top-color:var(--burgundy);">

    }).join('')}

  </div>` : '';

  return `

function countDuplicateAttendance(month){
  const rows = attendance.filter(a=>a.date.slice(0,7)===month);
  const groups = {};
  rows.forEach(r=>{ const k=r.workerId+'|'+r.date; groups[k]=(groups[k]||0)+1; });
  return Object.values(groups).reduce((s,n)=> s + (n>1? n-1 : 0), 0);
}
function dedupeAttendance(){
  const month = state.month;
  const groups = {};
  attendance.forEach(r=>{
    if(r.date.slice(0,7)!==month) return;
    const k = r.workerId+'|'+r.date;
    if(!groups[k]) groups[k]=[];
    groups[k].push(r);
  });
  const toRemoveIds = new Set();
  Object.values(groups).forEach(list=>{
    if(list.length<2) return;
    list.sort((a,b)=> (a.checkIn||'99:99').localeCompare(b.checkIn||'99:99'));
    const keep = list[0];
    // ادمج أفضل قيم checkOut/الموقع/المهام من بقية السجلات المكررة داخل السجل المحتفظ به
    list.slice(1).forEach(dup=>{
      if(dup.checkOut && (!keep.checkOut || dup.checkOut > keep.checkOut)) keep.checkOut = dup.checkOut;
      if(dup.lat!=null && keep.lat==null){ keep.lat=dup.lat; keep.lng=dup.lng; }
      if(dup.outLat!=null && keep.outLat==null){ keep.outLat=dup.outLat; keep.outLng=dup.outLng; }
      if(dup.tasks && !keep.tasks) keep.tasks = dup.tasks;
      if(dup.notes && !keep.notes) keep.notes = dup.notes;
      toRemoveIds.add(dup.id);
    });
  });
  attendance = attendance.filter(a=> !toRemoveIds.has(a.id));
  saveAttendance();
  logActivity(`${state.session.name} نظّف ${toRemoveIds.size} سجل حضور مكرر لشهر ${month}`);
  render();
  alert(`تم حذف ${toRemoveIds.size} سجل مكرر ودمج بياناتها في السجل الأصلي.`);
}

function exportAttendanceCSV(month){
  const wname = id => { const w=workers.find(x=>x.id===id); return w?w.name:'؟'; };
  const rows = attendance.filter(a=>a.date.slice(0,7)===month).sort((a,b)=> a.date.localeCompare(b.date) || wname(a.workerId).localeCompare(wname(b.workerId)));
  let csv = '\uFEFF' + 'التاريخ,المتعاون,وقت الحضور,وقت الانصراف\n';
  rows.forEach(r=>{ csv += `${r.date},${wname(r.workerId)},${r.checkIn||''},${r.checkOut||''}\n`; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});

  a.href = url; a.download = `سجل_الحضور_${month}.csv`;

  URL.revokeObjectURL(url);
}

let checkinBusy = false;
async function selfIn(shift){
  if(checkinBusy){ return; }
  checkinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الحضور'); return; }
    let freshWorkers;
    try{ freshWorkers = (await fbGet(KEYS.workers)) || workers; }catch(e){ freshWorkers = workers; }
    const idx = freshWorkers.findIndex(x=>x.id===state.session.id);
    const w = freshWorkers[idx];
    if(!w){ alert('تعذر التحقق من حسابك، أعد تحميل الصفحة وحاول مجدداً.'); return; }
    const deviceId = getDeviceId();
    if(!w.deviceLockDisabled){
      if(!w.lockedDeviceId){
        w.lockedDeviceId = deviceId;
        let ok2 = false;
        try{ await fbSetPath(`${KEYS.workers}/${idx}/lockedDeviceId`, deviceId); ok2 = true; }catch(e){ console.error('scoped lock write failed', e); }
        if(!ok2){
          try{ await fbSet(KEYS.workers, freshWorkers); }catch(e2){ console.error('fallback full write failed too', e2); }
        }
      } else if(w.lockedDeviceId !== deviceId){
        alert('هذا الرمز مرتبط بجهاز آخر.\n\nإذا بدّلت هاتفك فعلاً: اطلب من صاحب المحل أو المسؤول يفك ربط جهازك من تبويب "المتعاونين".\n\nإذا كان نفس هاتفك دائماً وتظهر لك هذه الرسالة بشكل متكرر: افتح الرابط من متصفح عادي (Chrome أو Safari) وليس من داخل واتساب أو انستغرام أو ماسنجر، ولا تستخدم وضع التصفح الخفي، ثم احفظ الصفحة على الشاشة الرئيسية وافتحها دائماً من هناك.');
        return;
      }
    }
    workers = freshWorkers;
    // تحقق مباشر قبل الإضافة لمنع تكرار سجل نفس الفوج في نفس اليوم
    let freshAttendance;
    try{ freshAttendance = (await fbGet(KEYS.attendance)) || attendance; }catch(e){ freshAttendance = attendance; }
    attendance = freshAttendance;
    if(attendance.find(a=>a.workerId===state.session.id && a.date===todayStr() && a.shift===shift)){ render(); return; }
    const geo = await getGeoLocation();
    attendance.push({id:uid(), workerId:state.session.id, date:todayStr(), shift, checkIn:nowTime(), checkOut:null,
      lat: geo?geo.lat:null, lng: geo?geo.lng:null}); saveAttendance();
    logActivity(`${w.name} سجّل حضوره بنفسه (فوج ${shift})`);
    render();
  } finally { checkinBusy = false; }
}
async function selfOut(shift){
  if(checkinBusy){ return; }
  checkinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الانصراف'); return; }
    const rec=attendance.find(a=>a.workerId===state.session.id && a.date===todayStr() && a.shift===shift && !a.checkOut);
    if(!rec){ return; }
    const w = workers.find(x=>x.id===state.session.id);
    const deviceId = getDeviceId();
    if(!w.deviceLockDisabled && w.lockedDeviceId && w.lockedDeviceId !== deviceId){
      alert('هذا الرمز مرتبط بجهاز آخر.\n\nإذا بدّلت هاتفك فعلاً: اطلب من صاحب المحل أو المسؤول يفك ربط جهازك من تبويب "المتعاونين".\n\nإذا كان نفس هاتفك دائماً وتظهر لك هذه الرسالة بشكل متكرر: افتح الرابط من متصفح عادي (Chrome أو Safari) وليس من داخل واتساب أو انستغرام أو ماسنجر، ولا تستخدم وضع التصفح الخفي، ثم احفظ الصفحة على الشاشة الرئيسية وافتحها دائماً من هناك.');
      return;
    }
    const geo = await getGeoLocation();
    rec.checkOut=nowTime(); rec.outLat=geo?geo.lat:null; rec.outLng=geo?geo.lng:null;
    saveAttendance();
    logActivity(`${w.name} سجّل انصرافه بنفسه (فوج ${shift})`);
    render();
  } finally { checkinBusy = false; }
}
function workerMine(){
  return `${paydayBanner()}${lateWarningBanner(state.month, state.session.id)}<div class="card">
    <div class="row" style="align-items:center; margin-bottom:6px;"><h2 style="margin:0;">سجلي الشهري</h2>${monthPicker()}</div>
    ${RUBRIC}
  </div>
  ${wageDetailCard(state.session.id, state.month, isPaid(state.session.id, state.month))}`;
}
function workerRequests(){
  const mine = requests.filter(r=>r.workerId===state.session.id).sort((a,b)=> b.createdAt.localeCompare(a.createdAt));
  const rows = mine.map(r=>{
    const badge = r.status==='pending'?'badge-open':r.status==='approved'?'badge-present':'badge-absent';
    const label = r.status==='pending'?'قيد الانتظار':r.status==='approved'?'تمت الموافقة':'مرفوض';
    return `<div class="list-item">
      <div><b>${REQ_TYPES[r.type]}</b> — ${r.amount} <span class="muted">(${r.month})</span> ${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</div>
      <span class="badge ${badge}">${label}</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>تقديم طلب جديد</h2>
    <p class="muted">الطلب ينتظر موافقة المشرف أو صاحب المحل قبل ما يُحتسب في أجرتك.</p>
    <div class="row">
      <div><label>نوع الطلب</label><select id="rq-type">
        <option value="extraDays">يوم عمل إضافي (يوم راحتي واشتغلت)</option>
        <option value="live">جلسة لايف</option>
        <option value="overtime">ساعات إضافية</option>
        <option value="excusedAbsence">غياب مبرر (مرض/ظرف)</option>
      </select></div>
      <div><label>القيمة</label><input id="rq-amount" type="number" value="1" min="0" step="0.5"></div>
    </div>
    <div class="row">
      <div><label>الشهر</label><input id="rq-month" type="month" value="${state.month}"></div>
      <div><label>ملاحظة (اختياري)</label><input id="rq-note" placeholder=""></div>
    </div>
    <button class="btn btn-brass" onclick="submitMyRequest()">إرسال الطلب</button>
  </div>
  <div class="card"><h2>طلباتي</h2>${rows||'<p class="empty">لا يوجد طلبات بعد</p>'}</div>`;
}
function submitMyRequest(){
  const type = document.getElementById('rq-type').value;
  const amount = document.getElementById('rq-amount').value;
  const month = document.getElementById('rq-month').value || state.month;
  const note = document.getElementById('rq-note').value.trim();
  addRequest(state.session.id, type, amount, note, month);
}

async function initFromUrl(){
  await loadShopsRegistry();
  const params = new URLSearchParams(window.location.search);
  const shopParam = params.get('shop');
  if(shopParam && shopsRegistry.shops.find(s=>s.id===shopParam)){
    state.shopId = shopParam;
    state.screen = 'loading';
    document.getElementById('app').innerHTML = '<div class="empty">جارِ التحميل...</div>';
    loadAll();
  } else {
    state.screen = 'shopselect';
    render();
  }
}
initFromUrl();
</script>
