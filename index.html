<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفتح — دفتر تقييم وأجور المتعاونين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F3ECD8; --paper2:#EAE1C3; --ink:#22303F; --ink-soft:#5B6774;
    --brass:#9C7318; --brass-light:#C9A227; --burgundy:#7A2E2E; --forest:#3C6E47;
    --line:#CDBE93; --white:#FFFDF6; --shadow:0 2px 10px rgba(34,48,63,0.12);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Cairo',sans-serif; color:var(--ink); background:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent 0px, transparent 37px, var(--line) 37px, var(--line) 38px);
    min-height:100vh; direction:rtl; }
  h1,h2,h3,.serif{ font-family:'Markazi Text',serif; }
  #app{ max-width:1040px; margin:0 auto; padding:18px 16px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:center; gap:10px; padding:8px 12px;
    background:var(--ink); color:var(--white); position:sticky; top:0; z-index:50; }
  .topbar img{ height:28px; width:auto; background:#fff; border-radius:5px; padding:2px; }
  .topbar span{ font-family:'Markazi Text'; font-weight:700; font-size:17px; letter-spacing:.3px; }
  .brandbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; margin-bottom:18px;
    background:var(--ink); color:var(--white); border-radius:10px; box-shadow:var(--shadow); flex-wrap:wrap; gap:8px; }
  .brandbar h1{ margin:0; font-size:26px; font-weight:700; }
  .brandbar .sub{ font-size:13px; color:#C9D3DC; margin-top:2px; }
  .brandbar .who{ font-size:14px; }
  .brandbar .who b{ color:var(--brass-light); }
  .tab-bar{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab{ font-family:'Cairo'; font-weight:600; font-size:14px; padding:9px 16px 8px; cursor:pointer; border:none;
    background:var(--paper2); color:var(--ink-soft); border-radius:8px 8px 0 0; border-bottom:3px solid transparent; transition:.15s; }
  .tab:hover{ background:#E2D6AF; }
  .tab.active{ background:var(--white); color:var(--ink); border-bottom:3px solid var(--brass); box-shadow:var(--shadow); }
  .card{ background:var(--white); border-radius:10px; padding:20px; box-shadow:var(--shadow); margin-bottom:16px;
    position:relative; border-top:3px solid var(--brass-light); }
  .card h2{ margin:0 0 14px; font-size:22px; }
  .card h3{ margin:0 0 10px; font-size:19px; color:var(--ink-soft); }
  .muted{ color:var(--ink-soft); font-size:13.5px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:150px; }
  label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input, select{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:7px; font-family:'Cairo';
    font-size:14.5px; background:#FFFDF9; color:var(--ink); margin-bottom:12px; }
  input:focus, select:focus{ outline:none; border-color:var(--brass); }
  .btn{ display:inline-block; padding:10px 22px; border-radius:7px; border:none; font-family:'Cairo'; font-weight:700;
    font-size:14.5px; cursor:pointer; transition:.15s; }
  .btn-primary{ background:var(--ink); color:var(--white); }
  .btn-primary:hover{ background:#33465C; }
  .btn-brass{ background:var(--brass); color:var(--white); }
  .btn-brass:hover{ background:var(--brass-light); }
  .btn-outline{ background:transparent; border:1.5px solid var(--ink-soft); color:var(--ink-soft); }
  .btn-outline:hover{ background:var(--paper2); }
  .btn-danger{ background:transparent; color:var(--burgundy); border:1.5px solid var(--burgundy); padding:6px 12px; font-size:13px;}
  .btn-danger:hover{ background:#F6E9E9; }
  .btn-sm{ padding:6px 14px; font-size:13px; }
  table.ledger{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.ledger th{ text-align:right; padding:8px 6px; border-bottom:2px solid var(--ink); color:var(--ink-soft); font-weight:700; font-size:12px; }
  table.ledger td{ padding:9px 6px; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
  table.ledger tr:last-child td{ border-bottom:none; }
  table.ledger tr.total-row td{ border-top:2px solid var(--ink); font-weight:800; padding-top:12px; }
  .amt{ font-weight:700; color:var(--forest); }
  .neg{ color:var(--burgundy); }
  .badge{ padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
  .badge-present{ background:#E1EEE3; color:var(--forest); }
  .badge-absent{ background:#F3E1E1; color:var(--burgundy); }
  .badge-open{ background:#FCF0D6; color:var(--brass); }
  .stamp{ position:absolute; top:16px; left:16px; width:92px; height:92px; border-radius:50%; border:3px double var(--burgundy);
    color:var(--burgundy); display:flex; align-items:center; justify-content:center; text-align:center; transform:rotate(-14deg);
    font-family:'Markazi Text',serif; font-weight:700; font-size:16px; opacity:.85; line-height:1.15; pointer-events:none; }
  .login-wrap{ max-width:460px; margin:60px auto 0; }
  .role-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .role-tabs .tab{ flex:1; text-align:center; border-radius:8px; border-bottom:3px solid transparent; }
  .worker-checkin-box{ text-align:center; padding:30px 10px; }
  .clock{ font-family:'Markazi Text'; font-size:52px; font-weight:700; color:var(--ink); margin:6px 0 2px; }
  .list-item{ display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px dashed var(--line); gap:10px; flex-wrap:wrap;}
  .list-item:last-child{ border-bottom:none; }
  .pin-tag{ font-family:'Markazi Text'; font-weight:700; letter-spacing:2px; color:var(--brass); }
  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); }
  .rubric{ background:var(--paper2); border-radius:8px; padding:12px 14px; font-size:13px; color:var(--ink-soft); margin-bottom:12px; }
  .rubric b{ color:var(--ink); }
  .rubric ul{ margin:6px 0 0; padding-inline-start:18px; }
  details.rubric-box summary{ cursor:pointer; font-weight:700; color:var(--brass); font-size:13.5px; margin-bottom:8px; }
</style>
</head>

function getGeoLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    const timer = setTimeout(()=>resolve(null), 6000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}); },
      ()=>{ clearTimeout(timer); resolve(null); },
      { enableHighAccuracy:true, timeout:5500, maximumAge:60000 }
    );
  });
}
function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

}

  }).catch(()=>{});
}

/* ================= CALCULATIONS ================= */
function presentDaysCount(workerId, month){
  const days = new Set(attendance.filter(a=>a.workerId===workerId && a.date.slice(0,7)===month && a.checkIn).map(a=>a.date));
  return days.size;
}
function getMonthlyRecord(workerId, month){
  return monthly.find(m=>m.workerId===workerId && m.month===month) || { extraDays:0, liveCount:0, overtimeHours:0, salesScore:0, mediaScore:0, transport:0, excusedAbsence:0, paidLeaveDays:0, note:'' };
}
function toMinutes(t){ if(!t) return null; const p=t.split(':'); return Number(p[0])*60+Number(p[1]); }
function isLateRecord(rec){
  if(!rec.checkIn) return false;
  if(Number(config.lateThresholdMinutes)===0) return false;
  const shift = rec.shift || computeShift(rec.checkIn);
  const startStr = shift==='صباحي' ? (config.morningShiftStart||'08:00') : (config.shiftSplitTime||'14:30');
  const diff = toMinutes(rec.checkIn) - toMinutes(startStr);
  return diff > (config.lateThresholdMinutes ?? 10);
}
function lateCountForMonth(workerId, month){
  return attendance.filter(a=>a.workerId===workerId && a.date.slice(0,7)===month && isLateRecord(a)).length;
}
function usedPaidLeave(workerId, year){
  return monthly.filter(m=>m.workerId===workerId && m.month.slice(0,4)===year).reduce((s,m)=>s+Number(m.paidLeaveDays||0),0);
}
function remainingPaidLeave(workerId, year){
  return Math.max((config.paidLeaveQuotaPerYear||10) - usedPaidLeave(workerId, year), 0);
}
function lateWarnings(month, onlyWorkerId){
  const threshold = config.lateCountForAbsence||5;
  let list = onlyWorkerId ? workers.filter(w=>w.id===onlyWorkerId) : workers;
  return list.map(w=>({ w, lc:lateCountForMonth(w.id, month) }))
    .filter(x=> x.lc>0 && (x.lc % threshold === threshold-1 || x.lc % threshold === 0));
}
function lateWarningBanner(month, onlyWorkerId){
  const warns = lateWarnings(month, onlyWorkerId);
  if(!warns.length) return '';
  const threshold = config.lateCountForAbsence||5;
  const rows = warns.map(x=>{
    const aboutToHit = x.lc % threshold === threshold-1;
    const msg = aboutToHit
      ? `عنده ${x.lc} تأخيرات هذا الشهر — تأخير واحد آخر يساوي خصم يوم غياب من الأجرة`
      : `وصل لـ ${x.lc} تأخيرات هذا الشهر — تم خصم ${Math.floor(x.lc/threshold)} يوم غياب من الأجرة بسبب التأخر`;
    return `<div class="list-item"><div><b>${esc(x.w.name)}</b> — ${msg}</div></div>`;
  }).join('');
  return `<div class="card" style="border-top-color:var(--burgundy);">
    <h3>⚠️ تنبيه التأخر</h3>${rows}
  </div>`;
}
function calcWage(workerId, month){
  const w = workers.find(x=>x.id===workerId);
  if(!w) return null;
  const present = presentDaysCount(workerId, month);
  const N = config.expectedMonthDays || 30;
  const baseSalary = w.baseSalary!=null ? w.baseSalary : config.baseSalary;
  const evalBonusPool = w.evalBonusPool!=null ? w.evalBonusPool : config.evalBonusPool;
  const liveRate = w.liveRate!=null ? w.liveRate : config.liveRate;
  const rec = getMonthlyRecord(workerId, month);
  const autoAbsence = Math.max(N - present, 0);
  const excusedAbsence = Math.min(Number(rec.excusedAbsence||0), autoAbsence);
  const paidLeaveDays = Math.min(Number(rec.paidLeaveDays||0), Math.max(autoAbsence-excusedAbsence,0));
  const lateCount = lateCountForMonth(workerId, month);
  const lateAbsenceDays = Math.floor(lateCount / (config.lateCountForAbsence||5));
  const absence = Math.max(autoAbsence - excusedAbsence - paidLeaveDays + lateAbsenceDays, 0);
  const dayRate = baseSalary / N;
  const grossSalary = baseSalary + (Number(rec.extraDays||0) - absence) * dayRate;
  const evalPoolWorked = (evalBonusPool / N) * (N - absence);
  const evalTotal = Number(rec.salesScore||0) + Number(rec.mediaScore||0);
  const bonus = evalPoolWorked * (evalTotal/100);
  const livePay = Number(rec.liveCount||0) * liveRate;
  const overtimePay = (dayRate / (config.workdayHours||6.5)) * Number(rec.overtimeHours||0);
  const transport = Number(rec.transport||0);
  const total = grossSalary + bonus + livePay + overtimePay + transport;
  const rounded = Math.round(total/100)*100;
  return { w, present, expected:N, autoAbsence, excusedAbsence, paidLeaveDays, lateCount, lateAbsenceDays, absence, rec, baseSalary, evalBonusPool, liveRate, dayRate, grossSalary, evalPoolWorked, evalTotal, bonus, livePay, overtimePay, transport, total, rounded };
}
function isPaid(workerId, month){ return !!payments.find(p=>p.workerId===workerId && p.month===month && p.paid); }

const REQ_TYPES = { extraDays:'يوم عمل إضافي', live:'جلسة لايف', overtime:'ساعات إضافية', excusedAbsence:'غياب مبرر (لا يُخصم)', paidLeave:'عطلة مدفوعة الأجر' };
const REQ_FIELD = { extraDays:'extraDays', live:'liveCount', overtime:'overtimeHours', excusedAbsence:'excusedAbsence', paidLeave:'paidLeaveDays' };
function addRequest(workerId, type, amount, note, month){
  if(!amount || amount<=0){ alert('أدخل قيمة صحيحة'); return; }
  requests.push({ id:uid(), workerId, type, amount:Number(amount), note:note||'', month, status:'pending', createdAt:todayStr() });
  saveRequests();
  const w = workers.find(x=>x.id===workerId);
  logActivity(`${w?w.name:'؟'} قدّم طلب ${REQ_TYPES[type]}: ${amount} (${month})`);
  render();
}
function decideRequest(id, approve){
  const req = requests.find(r=>r.id===id);
  if(!req || req.status!=='pending') return;
  req.status = approve? 'approved':'rejected';
  req.decidedBy = state.session.name; req.decidedAt = todayStr();
  if(approve){
    const field = REQ_FIELD[req.type];
    let rec = monthly.find(m=>m.workerId===req.workerId && m.month===req.month);
    if(!rec){ rec = { id:uid(), workerId:req.workerId, month:req.month, extraDays:0, liveCount:0, overtimeHours:0, salesScore:0, mediaScore:0, transport:0, excusedAbsence:0, paidLeaveDays:0, note:'' }; monthly.push(rec); }
    rec[field] = Number(rec[field]||0) + req.amount;
    saveMonthly();
  }
  saveRequests();
  const w = workers.find(x=>x.id===req.workerId);
  logActivity(`${state.session.name} ${approve?'وافق على':'رفض'} طلب ${REQ_TYPES[req.type]} للمتعاون ${w?w.name:'؟'} (${req.month})`);
  render();
}
function pendingRequestsCount(){ return requests.filter(r=>r.status==='pending').length; }
function togglePaid(workerId, month){
  let rec = payments.find(p=>p.workerId===workerId && p.month===month);
  if(!rec){ rec={workerId, month, paid:false}; payments.push(rec); }
  rec.paid = !rec.paid; rec.paidDate = rec.paid? todayStr(): null;
  savePayments();
  const w = workers.find(x=>x.id===workerId);
  logActivity(`${state.session.name} علّم أجرة ${w?w.name:'؟'} لشهر ${month} كـ ${rec.paid?'مصروف':'غير مصروف'}`);
  render();
}
function daysUntilPayday(){
  const now=new Date(); const day=config.paydayDay||6;
  let target=new Date(now.getFullYear(), now.getMonth(), day);
  if(target<now) target=new Date(now.getFullYear(), now.getMonth()+1, day);
  return Math.ceil((target-now)/(1000*60*60*24));
}
function paydayBanner(){
  const d=daysUntilPayday();
  const label = d===0? 'اليوم هو يوم صرف الأجور 💰' : `باقي ${d} ${d===1?'يوم':'أيام'} على موعد صرف الأجور (يوم ${config.paydayDay} من كل شهر)`;
  return `<div class="card" style="border-top-color:var(--forest); text-align:center; padding:12px;"><b>${label}</b></div>`;
}

function exportActivityCSV(month){
  const rows = activityLog.filter(a=> a.at.slice(0,7)===month).sort((a,b)=> a.at.localeCompare(b.at));
  let csv = '\uFEFF' + 'التاريخ,الوقت,الفاعل,الحدث\n';
  rows.forEach(a=>{
    const d = new Date(a.at);
    const dateStr = d.toISOString().slice(0,10);
    const timeStr = d.toTimeString().slice(0,5);
    const clean = s => `"${(s||'').toString().replace(/"/g,'""')}"`;
    csv += `${dateStr},${timeStr},${clean(a.actor)},${clean(a.action)}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `السجل_العام_${month}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function loadAllShopsOverview(month){
  const savedConfig=config, savedWorkers=workers, savedAttendance=attendance, savedMonthly=monthly, savedPayments=payments, savedShopId=state.shopId;
  const results = [];
  for(const s of shopsRegistry.shops){
    state.shopId = s.id;
    try{
      const cfg = await fbGet(KEYS.config);
      if(!cfg){ results.push({ id:s.id, name:s.name, notSetup:true }); continue; }
      config = cfg;
      workers = (await fbGet(KEYS.workers)) || [];
      attendance = (await fbGet(KEYS.attendance)) || [];
      monthly = (await fbGet(KEYS.monthly)) || [];
      payments = (await fbGet(KEYS.payments)) || [];
      let totalWage=0, totalLate=0;
      workers.forEach(w=>{
        const c = calcWage(w.id, month);
        totalWage += c.rounded; totalLate += c.lateCount;
      });
      const N = config.expectedMonthDays||30;
      const latePct = workers.length? Math.round((totalLate/(workers.length*N))*1000)/10 : 0;
      results.push({ id:s.id, name:config.shopName||s.name, notSetup:false, workerCount:workers.length, totalWage, totalLate, latePct });
    }catch(e){
      results.push({ id:s.id, name:s.name, error:true });
    }
  }
  config=savedConfig; workers=savedWorkers; attendance=savedAttendance; monthly=savedMonthly; payments=savedPayments; state.shopId=savedShopId;
  return results;
}

function doLoginOwner(){

  else alert('رمز خاطئ');
}
function doLoginSupervisor(){
  const id=document.getElementById('lg-sup').value, pin=document.getElementById('lg-pin').value.trim();
  const s=config.supervisors.find(x=>x.id===id);
  if(s&&pin===s.pin){ state.session={role:'supervisor', id:s.id, name:s.name}; state.screen='supervisor'; state.tab='selfcheckin'; render(); }
  else alert('رمز خاطئ');
}
async function doLoginWorker(){
  const id=document.getElementById('lg-w').value, pin=document.getElementById('lg-pin').value.trim();
  const w=workers.find(x=>x.id===id);
  if(!(w&&pin===w.pin)){ alert('رمز خاطئ'); return; }

  let freshWorkers;
  try{ freshWorkers = (await fbGet(KEYS.workers)) || workers; }catch(e){ freshWorkers = workers; }
  const idx = freshWorkers.findIndex(x=>x.id===id);
  const fw = freshWorkers[idx];
  const deviceId = getDeviceId();
  if(fw && fw.lockedDeviceId && fw.lockedDeviceId !== deviceId && !fw.deviceLockDisabled){
    alert('هذا الرمز مرتبط بجهاز آخر. إذا بدّلت هاتفك، اطلب من صاحب المحل يعيد ربط جهازك من تبويب "المتعاونين".');
    return;
  }
  if(fw && !fw.lockedDeviceId && !fw.deviceLockDisabled){
    fw.lockedDeviceId = deviceId;
    let ok2=false;
    try{ await fbSetPath(`${KEYS.workers}/${idx}/lockedDeviceId`, deviceId); ok2=true; }catch(e){ console.error('scoped lock write failed', e); }
    if(!ok2){ try{ await fbSet(KEYS.workers, freshWorkers); }catch(e2){ console.error('fallback full write failed too', e2); } }
  }
  workers = freshWorkers;
  state.session={role:'worker', id:w.id, name:w.name}; state.screen='worker'; state.tab='checkin'; render();
}

async function copyShopLink(){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('shop', state.shopId);
  const link = url.toString();
  try{
    await navigator.clipboard.writeText(link);
    alert('تم نسخ الرابط:\n' + link + '\nأرسله للمتعاونين، ويقدروا يضيفوه لشاشة هاتفهم الرئيسية.');
  }catch(e){
    alert('انسخ هذا الرابط يدوياً:\n' + link);
  }
}

async function saveWorkerWage(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const base = Number(document.getElementById(`ww-base-${id}`).value||0);
  const ev = Number(document.getElementById(`ww-eval-${id}`).value||0);
  const live = Number(document.getElementById(`ww-live-${id}`).value||0);
  workers[idx].baseSalary = base; workers[idx].evalBonusPool = ev; workers[idx].liveRate = live;
  try{
    await fbSetPath(`${KEYS.workers}/${idx}/baseSalary`, base);
    await fbSetPath(`${KEYS.workers}/${idx}/evalBonusPool`, ev);
    await fbSetPath(`${KEYS.workers}/${idx}/liveRate`, live);
  }catch(e){
    console.error('scoped wage write failed, falling back', e);
    try{ await fbSet(KEYS.workers, workers); }catch(e2){}
  }
  state.editWorkerWageId=null;
  logActivity(`${state.session.name} عدّل إعدادات أجرة ${workers[idx].name}`);
  render();
}
async function saveWorkerPin(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const pin = document.getElementById(`wp-pin-${id}`).value.trim();
  if(!pin){ alert('أدخل رمزاً صحيحاً'); return; }
  workers[idx].pin = pin;
  try{ await fbSetPath(`${KEYS.workers}/${idx}/pin`, pin); }
  catch(e){ console.error('scoped pin write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  state.editWorkerPinId=null;
  logActivity(`${state.session.name} غيّر رمز دخول ${workers[idx].name}`);

async function resetDeviceLock(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  workers[idx].lockedDeviceId=null;
  try{ await fbSetPath(`${KEYS.workers}/${idx}/lockedDeviceId`, null); }
  catch(e){ console.error('scoped unlock write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  logActivity(`${state.session.name} أعاد ربط جهاز ${workers[idx].name}`);
  render();
}
async function toggleDeviceLockRequirement(id){
  const idx = workers.findIndex(x=>x.id===id);
  if(idx<0) return;
  const next = !workers[idx].deviceLockDisabled;
  workers[idx].deviceLockDisabled = next;
  if(next){ workers[idx].lockedDeviceId = null; }
  try{ await fbSetPath(`${KEYS.workers}/${idx}`, workers[idx]); }
  catch(e){ console.error('scoped device-lock toggle write failed, falling back', e); try{ await fbSet(KEYS.workers, workers); }catch(e2){} }
  logActivity(`${state.session.name} ${next?'عطّل':'فعّل'} ربط الجهاز لـ${workers[idx].name}`);
  render();
}

function downloadBackup(){
  const backup = { exportedAt:new Date().toISOString(), config, workers, attendance, monthly, payments, requests, activityLog, dutyLog, supervisorAttendance };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Backup_${(config.shopName||'shop').replace(/[^\p{L}\p{N}]+/gu,'_')}_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity(`${state.session.name} حمّل نسخة احتياطية كاملة`);
}
async function restoreBackup(){
  const fileInput = document.getElementById('restore-file');
  const file = fileInput.files[0];
  if(!file){ alert('اختر ملف النسخة الاحتياطية أولاً'); return; }
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ alert('الملف غير صالح'); return; }
  if(!data.config || !data.workers){ alert('الملف لا يحتوي على بيانات صحيحة'); return; }
  try{
    config = data.config; workers = data.workers||[]; attendance = data.attendance||[]; monthly = data.monthly||[];
    payments = data.payments||[]; requests = data.requests||[]; activityLog = data.activityLog||[]; dutyLog = data.dutyLog||[];
    supervisorAttendance = data.supervisorAttendance||[];
    await Promise.all([
      fbSet(KEYS.config, config), fbSet(KEYS.workers, workers), fbSet(KEYS.attendance, attendance),
      fbSet(KEYS.monthly, monthly), fbSet(KEYS.payments, payments), fbSet(KEYS.requests, requests),
      fbSet(KEYS.activity, activityLog), fbSet(KEYS.duty, dutyLog), fbSet(KEYS.supAttendance, supervisorAttendance)
    ]);
    alert('تم استعادة النسخة الاحتياطية بنجاح');
    render();
  }catch(e){
    alert('حدث خطأ أثناء الاستعادة، تحقق من الاتصال بالإنترنت وحاول مجدداً.');
  }
}

function supAttendance(){
  const today=todayStr();
  const todays=attendance.filter(a=>a.date===today);
  const rows = workers.map(w=>{

      const status = !rec? `<span class="badge badge-absent">${shift}: لم يحضر</span>`
        : !rec.checkOut? `<span class="badge badge-open">${shift}: حاضر منذ ${rec.checkIn}</span>`

      const inputId = `mk-time-${w.id}-${shift}`;
      const btns = `${!rec?`
          <input type="time" id="${inputId}" value="${nowTime()}" style="width:auto; display:inline-block; margin:0 4px;">
          <button class="btn btn-brass btn-sm" onclick="markIn('${w.id}','${shift}', document.getElementById('${inputId}').value)">حضور ${shift}</button>`:''}

let supCheckinBusy = false;
async function supSelfIn(shift){
  if(supCheckinBusy) return;
  supCheckinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الحضور'); return; }
    let fresh;
    try{ fresh = (await fbGet(KEYS.supAttendance)) || supervisorAttendance; }catch(e){ fresh = supervisorAttendance; }
    supervisorAttendance = fresh;
    if(supervisorAttendance.find(a=>a.supervisorId===state.session.id && a.date===todayStr() && a.shift===shift)){ render(); return; }
    const geo = await getGeoLocation();
    const inTime = nowTime();
    supervisorAttendance.push({ id:uid(), supervisorId:state.session.id, date:todayStr(), shift, checkIn:inTime, checkOut:null,
      lat: geo?geo.lat:null, lng: geo?geo.lng:null });
    saveSupervisorAttendance();
    logActivity(`${state.session.name} (مشرف) سجّل حضوره بنفسه (فوج ${shift})`);
    syncToMasterSheet({
      date: todayStr(), time: inTime, name: state.session.name, role: 'مشرف / مسؤول',
      shift, action: 'حضور', late: isLateRecord({checkIn: inTime, shift}) ? 'متأخر' : 'في الوقت',
      mapLink: geo ? mapLink(geo.lat, geo.lng) : ''
    });
    render();
  } finally { supCheckinBusy = false; }
}
async function supSelfOut(shift){
  if(supCheckinBusy) return;
  supCheckinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الانصراف'); return; }
    const rec = supervisorAttendance.find(a=>a.supervisorId===state.session.id && a.date===todayStr() && a.shift===shift && !a.checkOut);
    if(!rec) return;
    const geo = await getGeoLocation();
    const outTime = nowTime();
    rec.checkOut=outTime; rec.outLat=geo?geo.lat:null; rec.outLng=geo?geo.lng:null;
    saveSupervisorAttendance();
    logActivity(`${state.session.name} (مشرف) سجّل انصرافه بنفسه (فوج ${shift})`);
    syncToMasterSheet({
      date: todayStr(), time: outTime, name: state.session.name, role: 'مشرف / مسؤول',
      shift, action: 'انصراف', late: '—',
      mapLink: geo ? mapLink(geo.lat, geo.lng) : ''
    });
    render();
  } finally { supCheckinBusy = false; }
}

function saveMonthlyRecord(workerId){
  const data = {
    extraDays: Number(document.getElementById('mo-extra').value||0),
    liveCount: Number(document.getElementById('mo-live').value||0),
    overtimeHours: Number(document.getElementById('mo-ot').value||0),
    transport: Number(document.getElementById('mo-transport').value||0),
    salesScore: Math.min(50, Number(document.getElementById('mo-sales').value||0)),
    mediaScore: Math.min(50, Number(document.getElementById('mo-media').value||0)),
    note: document.getElementById('mo-note').value.trim(),
  };
  let existing = monthly.find(m=>m.workerId===workerId && m.month===state.month);
  if(existing) Object.assign(existing, data);
  else monthly.push({ id:uid(), workerId, month:state.month, excusedAbsence:0, ...data });
  saveMonthly();
  const w = workers.find(x=>x.id===workerId);
  logActivity(`${state.session.name} عدّل التقييم الشهري لـ ${w?w.name:'؟'} (${state.month})`);

}

function reportRows(){
  const [from, to] = reportRange();
  const workerId = (state.report.type==='worker') ? state.report.workerId : null;
  const wname = id => { const w=workers.find(x=>x.id===id); return w?w.name:'؟'; };
  let rows = attendance.filter(a=> a.date>=from && a.date<=to && (!workerId || a.workerId===workerId));
  rows.sort((a,b)=> a.date.localeCompare(b.date) || wname(a.workerId).localeCompare(wname(b.workerId)));
  return rows.map(r=>({
    date:r.date, worker:wname(r.workerId), checkIn:r.checkIn||'', checkOut:r.checkOut||'',
    tasks:(r.tasks||'').split('\n').filter(l=>l.trim()).join('، '),
    taskCount: r.tasks? r.tasks.split('\n').filter(l=>l.trim()).length : 0,
    notes:r.notes||'', late: isLateRecord(r)?'نعم':'لا'
  }));
}
function reportRange(){
  const r = state.report;
  if(!r) return [todayStr(), todayStr()];
  if(r.type==='daily') return [r.date, r.date];
  if(r.type==='weekly') return [addDays(r.date, -6), r.date];
  if(r.type==='monthly') return [state.month+'-01', lastDayOfMonth(state.month)];
  return [r.from, r.to];
}
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function lastDayOfMonth(monthStr){ const [y,m]=monthStr.split('-').map(Number); return new Date(y, m, 0).toISOString().slice(0,10); }

      ${types.map(t=>`<button class="tab ${r.type===t[0]?'active':''}" onclick="state.report.type='${t[0]}'; render();">${t[1]}</button>`).join('')}

  ['page','رسائل الصفحة'], ['whatsapp','واتساب'], ['calls','مكالمات'],

  const todays = attendance.filter(a=>a.workerId===state.session.id && a.date===todayStr());
  const netNote = config.shopPublicIP ? `<p class="muted" style="margin-top:8px;">التسجيل يعمل فقط عند الاتصال بشبكة واي فاي المحل</p>` : '';
  const shiftBlocks = ['صباحي','مسائي'].map(shift=>{
    const rec = todays.find(a=>a.shift===shift);
    let action;
    if(!rec) action = `<button class="btn btn-brass" onclick="selfIn('${shift}')">تسجيل حضور الفوج ${shift}</button>${netNote}`;
    else if(!rec.checkOut) action = `<div class="muted">حضرت الساعة ${rec.checkIn}</div><button class="btn btn-outline" style="margin-top:8px;" onclick="selfOut('${shift}')">تسجيل انصراف الفوج ${shift}</button>${netNote}`;
    else {
      const mins = toMinutes(nowTime()) - toMinutes(rec.checkOut);
      const canUndo = mins!=null && mins>=0 && mins<=15;
      action = `<div class="muted">✓ تم: حضور ${rec.checkIn} — انصراف ${rec.checkOut}</div>
        ${canUndo?`<button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="undoCheckout('${shift}')">سجّلت الانصراف بالغلط؟ تراجع</button>`
                  :`<p class="muted" style="margin-top:6px;">إذا سجّلت الانصراف بالغلط، اطلب من صاحب المحل تعديل سجلك.</p>`}`;
    }
    let dutyCard = '';
    if(rec && rec.checkIn){
      const duty = getTodayDuty(state.session.id, shift);
      if(duty){
        dutyCard = `<div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">
          <b>مسؤولياتك:</b> <span class="muted">${esc(dutyRespText(duty) || 'ما حدّدتش أي مسؤولية')}</span>
          <button class="btn btn-outline btn-sm" style="margin-right:6px;" onclick="editDuty('${shift}')">تعديل</button>
        </div>`;
      } else {
        dutyCard = `<div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">
          <b>مسؤوليات هذا الفوج:</b><br>
          ${DUTY_ITEMS.map(([key,label])=>`
          <div style="margin-bottom:8px;">
            <label><input type="checkbox" id="duty-${key}-${shift}" style="width:auto; margin-left:6px;"> ${label}</label>
            <input id="duty-note-${key}-${shift}" placeholder="ملاحظة (اختياري)" style="margin-top:4px;">
          </div>`).join('')}
          <button class="btn btn-brass btn-sm" style="margin-top:6px;" onclick="saveDuty('${shift}')">حفظ</button>
        </div>`;
      }
    }
    return `<div class="card"><h3>الفوج ${shift}</h3>${action}${dutyCard}</div>`;
  }).join('');
  return `<div class="card worker-checkin-box"><div class="muted">${todayStr()}</div><div class="clock">${nowTime()}</div></div>${shiftBlocks}`;
}

function saveDuty(shift){
  const resp = [];
  const notes = {};
  DUTY_ITEMS.forEach(([key,label])=>{
    if(document.getElementById(`duty-${key}-${shift}`).checked){
      resp.push(label);
      const noteVal = document.getElementById(`duty-note-${key}-${shift}`).value.trim();
      if(noteVal) notes[label] = noteVal;
    }
  });
  dutyLog.push({ id:uid(), workerId:state.session.id, date:todayStr(), shift, responsibilities:resp, respNotes:notes });
  saveDutyLog();
  const summary = resp.map(r=> notes[r]?`${r} (${notes[r]})`:r).join('، ');
  logActivity(`${state.session.name} حدّد مسؤولياته (فوج ${shift}): ${summary||'لا شي'}`);
  render();
}
function editDuty(shift){
  dutyLog = dutyLog.filter(d=>!(d.workerId===state.session.id && d.date===todayStr() && d.shift===shift));
  saveDutyLog(); render();
}

let checkinBusy = false;
async function selfIn(shift){
  if(checkinBusy){ return; }
  checkinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الحضور'); return; }
    let freshWorkers;
    try{ freshWorkers = (await fbGet(KEYS.workers)) || workers; }catch(e){ freshWorkers = workers; }
    const idx = freshWorkers.findIndex(x=>x.id===state.session.id);
    const w = freshWorkers[idx];
    if(!w){ alert('تعذر التحقق من حسابك، أعد تحميل الصفحة وحاول مجدداً.'); return; }
    const deviceId = getDeviceId();
    if(!w.deviceLockDisabled){
      if(!w.lockedDeviceId){
        w.lockedDeviceId = deviceId;
        let ok2 = false;
        try{ await fbSetPath(`${KEYS.workers}/${idx}/lockedDeviceId`, deviceId); ok2 = true; }catch(e){}
        if(!ok2){ try{ await fbSet(KEYS.workers, freshWorkers); }catch(e2){} }
      } else if(w.lockedDeviceId !== deviceId){
        alert('هذا الرمز مرتبط بجهاز آخر. إذا بدّلت هاتفك، اطلب من صاحب المحل يعيد ربط جهازك من تبويب "المتعاونين".');
        return;
      }
    }
    workers = freshWorkers;
    let freshAtt;
    try{ freshAtt = (await fbGet(KEYS.attendance)) || attendance; }catch(e){ freshAtt = attendance; }
    attendance = freshAtt;
    if(attendance.find(a=>a.workerId===state.session.id && a.date===todayStr() && a.shift===shift)){ render(); return; }
    const geo = await getGeoLocation();
    const inTime = nowTime();
    attendance.push({ id:uid(), workerId:state.session.id, date:todayStr(), shift, checkIn:inTime, checkOut:null,
      lat: geo?geo.lat:null, lng: geo?geo.lng:null });
    saveAttendance();
    logActivity(`${state.session.name} سجّل حضوره بنفسه (فوج ${shift})`);
    syncToMasterSheet({
      date: todayStr(), time: inTime, name: state.session.name, role: 'متعاون',
      shift, action: 'حضور', late: isLateRecord({checkIn: inTime, shift}) ? 'متأخر' : 'في الوقت',
      mapLink: geo ? mapLink(geo.lat, geo.lng) : ''
    });
    render();
  } finally { checkinBusy = false; }
}

async function selfOut(shift){
  if(checkinBusy){ return; }
  checkinBusy = true;
  try{
    const ok = await checkShopNetwork();
    if(!ok){ alert('يجب الاتصال بشبكة واي فاي المحل لتسجيل الانصراف'); return; }
    const rec = attendance.find(a=>a.workerId===state.session.id && a.date===todayStr() && a.shift===shift && !a.checkOut);
    if(!rec) return;
    const geo = await getGeoLocation();
    const outTime = nowTime();
    rec.checkOut = outTime;
    rec.outLat = geo ? geo.lat : null;
    rec.outLng = geo ? geo.lng : null;
    saveAttendance();
    logActivity(`${state.session.name} سجّل انصرافه بنفسه (فوج ${shift})`);
    syncToMasterSheet({
      date: todayStr(), time: outTime, name: state.session.name, role: 'متعاون',
      shift, action: 'انصراف', late: '—',
      mapLink: geo ? mapLink(geo.lat, geo.lng) : ''
    });
    render();
  } finally { checkinBusy = false; }
}

function undoCheckout(shift){
  const rec = attendance.find(a=>a.workerId===state.session.id && a.date===todayStr() && a.shift===shift && a.checkOut);
  if(!rec) return;
  const mins = toMinutes(nowTime()) - toMinutes(rec.checkOut);
  if(mins == null || mins < 0 || mins > 15){
    alert('انتهت مهلة التراجع (15 دقيقة). اطلب من المسؤول أو صاحب المحل تعديل سجلك.');
    return;
  }
  rec.checkOut = null;
  rec.outLat = null;
  rec.outLng = null;
  saveAttendance();
  logActivity(`${state.session.name} تراجع عن تسجيل الانصراف (فوج ${shift})`);
  render();
}

function workerMine(){
  const wId = state.session.id;
  const paid = isPaid(wId, state.month);
  const myAtt = attendance.filter(a=>a.workerId===wId && a.date.slice(0,7)===state.month)
    .sort((a,b)=> b.date.localeCompare(a.date));
  const attRows = myAtt.map(r=>{
    const lateTag = isLateRecord(r) ? `<span class="badge badge-absent">متأخر</span>` : '';
    return `<div class="list-item">
      <div><b>${r.date}</b> <span class="badge badge-open">${r.shift||'—'}</span> <span class="muted">${r.checkIn||'—'} → ${r.checkOut||'—'}</span> ${lateTag}
        ${r.notes?`<div class="muted">ملاحظات: ${esc(r.notes)}</div>`:''}
      </div>
    </div>`;
  }).join('');

  return `${paydayBanner()}${lateWarningBanner(state.month, wId)}
  <div class="card">
    <div class="row" style="align-items:center;">
      <h2 style="margin:0;">سجل أجرتي وتقييمي</h2>
      ${monthPicker()}
    </div>
    <div class="muted" style="margin-top:6px;">رصيد العطلة المدفوعة الأجر المتبقي لهذا العام: <b>${remainingPaidLeave(wId, state.month.slice(0,4))} يوم</b></div>
  </div>
  ${wageDetailCard(wId, state.month, paid)}
  <div class="card">
    <h3>سجل حضوري لشهر ${state.month}</h3>
    ${attRows || '<p class="empty">لا يوجد سجلات حضور لهذا الشهر</p>'}
  </div>`;
}

function workerRequests(){
  const wId = state.session.id;
  const myReqs = requests.filter(r=>r.workerId===wId).sort((a,b)=> b.createdAt.localeCompare(a.createdAt));
  const rows = myReqs.map(r=>{
    const badge = r.status==='approved'?'badge-present': r.status==='rejected'?'badge-absent':'badge-open';
    const statusText = r.status==='approved'?'تمت الموافقة': r.status==='rejected'?'مرفوض':'قيد الانتظار';
    return `<div class="list-item">
      <div>
        <b>${REQ_TYPES[r.type]}</b>: ${r.amount} <span class="muted">(${r.month})</span>
        ${r.note?`<div class="muted">${esc(r.note)}</div>`:''}
      </div>
      <span class="badge ${badge}">${statusText}</span>
    </div>`;
  }).join('');

  return `<div class="card">
    <h2>تقديم طلب جديد</h2>
    <div class="row">
      <div><label>نوع الطلب</label>
        <select id="req-type">
          <option value="extraDays">يوم عمل إضافي (عمل في يوم الراحة)</option>
          <option value="live">جلسة لايف</option>
          <option value="overtime">ساعات إضافية</option>
          <option value="excusedAbsence">غياب مبرر (لا يُخصم)</option>
          <option value="paidLeave">عطلة مدفوعة الأجر</option>
        </select>
      </div>
      <div><label>القيمة</label><input id="req-amount" type="number" step="0.5" min="0.5" value="1"></div>
    </div>
    <div class="row">
      <div><label>الشهر المعني</label><input id="req-month" type="month" value="${state.month||curMonth()}"></div>
    </div>
    <label>ملاحظة أو تبرير (اختياري)</label>
    <input id="req-note" placeholder="اكتب سبباً أو تفاصيل إضافية...">
    <button class="btn btn-brass" onclick="submitWorkerRequest()">إرسال الطلب</button>
  </div>
  <div class="card">
    <h2>طلباتي السابقة</h2>
    ${rows || '<p class="empty">لم تقدم أي طلبات بعد</p>'}
  </div>`;
}

function submitWorkerRequest(){
  const type = document.getElementById('req-type').value;
  const amount = Number(document.getElementById('req-amount').value);
  const month = document.getElementById('req-month').value;
  const note = document.getElementById('req-note').value.trim();
  if(!amount || amount<=0){ alert('أدخل قيمة صحيحة'); return; }
  if(!month){ alert('اختر الشهر'); return; }
  addRequest(state.session.id, type, amount, note, month);
}

function workerNotifications(){
  const wId = state.session.id;
  const myNotifs = notifications.filter(n=>n.workerId===wId).sort((a,b)=> b.createdAt.localeCompare(a.createdAt));
  let hasUnread = false;
  myNotifs.forEach(n=>{ if(!n.read){ n.read = true; hasUnread = true; } });
  if(hasUnread){ saveNotifications(); }

  const rows = myNotifs.map(n=>`<div class="list-item" style="border-left: 3px solid ${n.read?'var(--line)':'var(--brass)'}; padding-left: 8px;">
    <div>
      <b>${esc(n.senderName||'الإدارة')}</b> <span class="muted" style="font-size:12px;">${new Date(n.createdAt).toLocaleString('ar-DZ')}</span>
      <div style="margin-top:4px; font-size:14.5px;">${esc(n.message)}</div>
    </div>
  </div>`).join('');

  return `<div class="card">
    <h2>إشعاراتي</h2>
    ${rows || '<p class="empty">لا يوجد إشعارات</p>'}
  </div>`;
}

/* ================= INITIALIZATION & REAL-TIME CLOCK ================= */
window.addEventListener('DOMContentLoaded', async function(){
  await loadShopsRegistry();
  const params = new URLSearchParams(window.location.search);
  const shopParam = params.get('shop');
  if(shopParam && shopsRegistry.shops.some(s=>s.id===shopParam)){
    selectShop(shopParam);
  } else {
    state.screen = 'shopselect';
    render();
  }
});

setInterval(function(){
  const clockEl = document.querySelector('.clock');
  if(clockEl){ clockEl.textContent = nowTime(); }
}, 1000);
</script>
